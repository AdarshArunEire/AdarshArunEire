name: Repo views

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count views across all repos
        run: python3 scripts/repo_views.py
        env:
          VIEWS_TOKEN: ${{ secrets.VIEWS_TOKEN }}
          INCLUDE_PRIVATE: "false"   # "true" to count private repos too
          INCLUDE_FORKS: "false"

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Update repo view count"
          git push
